<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fff8ed">
    <meta name="description" content="A conversation card for 180 FamDinner.">
    <title>180 FamDinner Connection Card</title>
    <link rel="stylesheet" href="styles.css?v=5">
    <script type="module" src="app.js?v=5"></script>
  </head>
  <body>
    <header class="site-header" aria-label="180 ministry">
      <img class="oneeighty-logo oneeighty-logo-dark" src="assets/Ministries/180-logo-dark.png" alt="180 logo dark">
      <img class="oneeighty-logo oneeighty-logo-light" src="assets/Ministries/180-logo-light.png" alt="180 logo light">
    </header>
    <main id="app" class="app-shell" aria-live="polite">
      <section class="panel loading-panel">
        <p class="eyebrow">180 FamDinner</p>
        <h1>Getting your table ready…</h1>
      </section>
    </main>
    <footer class="site-footer" aria-label="Makati Gospel Church">
      <img class="footer-cta footer-cta-dark" src="assets/Others/footer-cta-dark.png" alt="footer CTA">
      <img class="footer-cta footer-cta-light" src="assets/Others/footer-cta-light.png" alt="footer CTA">
      <div class="footer-container">
        <img class="footer-curve footer-curve-dark" src="assets/Others/curve-dark.png" alt="curve">
        <img class="footer-curve footer-curve-light" src="assets/Others/curve-light.png" alt="curve">
        <div class="footer-wave">
          <img class="mgc-logo mgc-logo-light" src="assets/MGC/mgc-logo-light.png" alt="">
          <img class="mgc-logo mgc-logo-dark" src="assets/MGC/mgc-logo-dark.png" alt="">
        </div>
      </div>
    </footer>
    <noscript>
      <p class="noscript">Please enable JavaScript to use the connection card.</p>
    </noscript>
  </body>
</html>
